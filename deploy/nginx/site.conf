# GENERATED from deploy/nginx/site.conf for __HOST__ (__KIND__). Static site + same-origin /api/ proxy to the private inquiry service.
server {
    listen 80;
    listen [::]:80;
    server_name __HOST__;
    return 301 https://$host$request_uri;
}
server {
    include snippets/scanner-block.conf;
    listen 443 ssl;
    listen [::]:443 ssl;
    listen 443 quic;
    listen [::]:443 quic;
    http2 on;
    http3 on;
    server_name __HOST__;
    ssl_certificate     /etc/letsencrypt/live/__CERT__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__CERT__/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    server_tokens off;

    root __ROOT__;
    index index.html;
    disable_symlinks on from=$document_root;

    # Access gate for staging — protection is separate from the cooperative robots directives.
    __AUTH__

    # Headers: this block owns its own policy (the wildcard's AdSense injector and its CSP must not apply here).
    include snippets/tdg-__KIND__-csp.conf;
    add_header Alt-Svc 'h3=":443"; ma=86400' always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header X-Robots-Tag "__ROBOTS__" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml application/wasm application/xml application/octet-stream;
    # The host runs brotli globally; a browser that accepts br gets brotli or nothing, so the binary types must be listed here too.
    brotli_types text/plain text/css text/javascript application/javascript application/json image/svg+xml application/wasm application/xml application/octet-stream;

    error_page 404 /404.html;

    # Same-origin inquiry endpoint. The service listens on loopback only; nothing else is proxied.
    location = /api/inquiries {
        include snippets/tdg-__KIND__-csp.conf;
        add_header X-Robots-Tag "noindex, nofollow" always;
        client_max_body_size 32k;
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 40s;
        proxy_redirect off;
    }
    location = /api/health { auth_basic off; proxy_pass http://127.0.0.1:3010; proxy_set_header Host $host; access_log off; }
    location /api/ { return 404; }

    # One trailing-slash policy: no trailing slash except the root.
    location ~ ^(.+)/$ { return 301 $1$is_args$args; }

    # Fingerprinted assets: long-lived immutable cache.
    location /assets/ { expires 1y; add_header Cache-Control "public, immutable" always; add_header X-Robots-Tag "__ROBOTS__" always; include snippets/tdg-__KIND__-csp.conf; try_files $uri =404; }
    location /animation/ { expires 30d; add_header Cache-Control "public, immutable" always; add_header X-Robots-Tag "__ROBOTS__" always; include snippets/tdg-__KIND__-csp.conf; try_files $uri =404; }
    location /fonts/ { expires 1y; add_header Cache-Control "public, immutable" always; add_header X-Robots-Tag "__ROBOTS__" always; include snippets/tdg-__KIND__-csp.conf; try_files $uri =404; }
    location /images/ { expires 7d; add_header Cache-Control "public" always; add_header X-Robots-Tag "__ROBOTS__" always; include snippets/tdg-__KIND__-csp.conf; try_files $uri =404; }

    # HTML and discovery files revalidate; prerendered pages live at <path>/index.html; anything else is a real 404.
    location = /404.html { internal; }
    location / { add_header Cache-Control "no-cache" always; add_header X-Robots-Tag "__ROBOTS__" always; include snippets/tdg-__KIND__-csp.conf; try_files $uri $uri/index.html =404; }
}
